<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generatore Annunci — Play Piano</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#1a1a1a;background:#f5f5f5;min-height:100vh}
#app{max-width:960px;margin:0 auto;padding:16px}
header{text-align:center;padding:16px 0 20px}
header svg{width:55%;max-width:260px}

/* TAB NAV */
.tab-nav{display:flex;gap:0;margin-bottom:20px;background:#fff;border:0.5px solid #e0e0e0;border-radius:10px;overflow:hidden}
.tab-nav button{flex:1;padding:11px 8px;font-size:13px;font-weight:500;background:none;border:none;cursor:pointer;color:#888;border-right:0.5px solid #e0e0e0;transition:all 0.15s}
.tab-nav button:last-child{border-right:none}
.tab-nav button.active{background:rgba(160,16,32,0.90);color:#fff}

.tab-content{display:none}
.tab-content.active{display:block}

/* GRID */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:650px){.grid{grid-template-columns:1fr}}

.card{background:#fff;border:0.5px solid #e0e0e0;border-radius:12px;padding:16px;margin-bottom:16px}
.card:last-child{margin-bottom:0}

h2{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px;margin-top:18px}
h2:first-child{margin-top:0}

.field{margin-bottom:12px}
label{font-size:11px;color:#888;display:block;margin-bottom:4px;font-weight:500}
select,input[type=text],input[type=number]{width:100%;padding:8px 10px;border:0.5px solid #e0e0e0;border-radius:8px;font-size:13px;color:#1a1a1a;background:#fff;outline:none;appearance:none;-webkit-appearance:none}
select:focus,input:focus{border-color:#A01020}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.checkbox-list{display:flex;flex-direction:column;gap:8px}
.checkbox-item{display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-size:13px;color:#333}
.checkbox-item input[type=checkbox]{margin-top:2px;accent-color:#A01020;width:15px;height:15px;flex-shrink:0;cursor:pointer}

.frase-altro textarea{width:100%;padding:8px 10px;border:0.5px solid #e0e0e0;border-radius:8px;font-size:13px;color:#1a1a1a;background:#fff;outline:none;resize:vertical;min-height:60px;font-family:inherit;margin-top:8px}
.frase-altro textarea:focus{border-color:#A01020}

.preview-box{white-space:pre-wrap;font-size:13px;line-height:1.7;color:#1a1a1a;background:#f9f9f9;border:0.5px solid #e0e0e0;border-radius:8px;padding:14px;min-height:200px;font-family:inherit}

.btn-primary{background:rgba(160,16,32,0.9);color:#fff;border:none;padding:11px 20px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;width:100%;margin-top:12px;transition:background 0.2s}
.btn-primary:hover{background:#A01020}
.btn-primary.copied{background:#639922}

.prezzi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.euro-wrap{position:relative}
.euro-wrap span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#888;font-size:13px;pointer-events:none}
.euro-wrap select{padding-left:22px}

.servizi-list{display:flex;flex-direction:column;gap:8px}
.servizio-item{display:flex;align-items:center;gap:8px;font-size:13px;color:#333}
.servizio-item input[type=checkbox]{accent-color:#A01020;width:15px;height:15px;cursor:pointer;flex-shrink:0}

/* SEZIONE MATRICOLE */
.matricola-input-wrap{position:relative}
.matricola-input-wrap input{font-size:16px;font-weight:500;padding:12px 14px;letter-spacing:1px}
.result-box{border-radius:10px;padding:16px;margin-top:14px;text-align:center}
.result-box.found{background:#fdeced;border:1.5px solid #A01020}
.result-box.notfound{background:#f5f5f5;border:0.5px solid #e0e0e0}
.result-anno{font-size:32px;font-weight:600;color:#A01020;margin-bottom:4px}
.result-label{font-size:12px;color:#888}
.result-luogo{font-size:13px;color:#555;margin-top:6px;font-weight:500}
.result-range{font-size:11px;color:#999;margin-top:4px}

.info-box{background:#f9f9f9;border:0.5px solid #e0e0e0;border-radius:8px;padding:12px;font-size:12px;color:#666;line-height:1.6;margin-top:12px}
.info-box strong{color:#1a1a1a}

.usa-annuncio-btn{display:flex;align-items:center;gap:8px;margin-top:14px;padding:10px 14px;background:#fff;border:0.5px solid #A01020;border-radius:8px;font-size:13px;color:#A01020;font-weight:500;cursor:pointer;width:100%;justify-content:center}
.usa-annuncio-btn:hover{background:#fdeced}

.btn-tipo-prev{background:#fff;border:0.5px solid #e0e0e0;border-radius:10px;padding:16px 8px;font-size:13px;font-weight:500;cursor:pointer;color:#1a1a1a;transition:all 0.15s;text-align:center;width:100%}
.btn-tipo-prev:hover{border-color:#A01020;color:#A01020;background:#fdeced}
.btn-tipo-prev.active{background:rgba(160,16,32,0.9);color:#fff;border-color:#A01020}
.prev-section{margin-bottom:12px}
.prev-label{font-size:11px;color:#888;font-weight:500;margin-bottom:4px;display:block}
.prev-input{width:100%;padding:8px 10px;border:0.5px solid #e0e0e0;border-radius:8px;font-size:13px;outline:none;font-family:inherit;background:#fff;color:#1a1a1a}
.prev-input:focus{border-color:#A01020}
.prev-textarea{width:100%;padding:8px 10px;border:0.5px solid #e0e0e0;border-radius:8px;font-size:13px;outline:none;font-family:inherit;resize:vertical;min-height:70px;background:#fff;color:#1a1a1a}
.piano-block{background:#f9f9f9;border:0.5px solid #e8e8e8;border-radius:10px;padding:12px;margin-bottom:10px}
.piano-block-title{font-size:12px;font-weight:600;color:#A01020;margin-bottom:10px}
.prev-check-row{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px}
.prev-check-row input[type=checkbox]{accent-color:#A01020;width:15px;height:15px;flex-shrink:0}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid #ddd;border-top-color:#A01020;border-radius:50%;animation:spin 0.7s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

function aggiorna(){
  const tipologia=document.getElementById('tipologia').value;
  const marcaVal=document.getElementById('marca').value;
  const marcaFinale=marcaVal==='ALTRO'?(document.getElementById('marca-altro').value||'___'):marcaVal;
  const modelloVal=document.getElementById('modello').value;
  const isModelloAltro=modelloVal==='Altro...';
  document.getElementById('field-modello-altro').style.display=isModelloAltro?'block':'none';
  const modelloFinale=isModelloAltro?(document.getElementById('modello-altro').value||'___'):modelloVal;
  const anno=document.getElementById('anno').value;
  const altezza=document.getElementById('altezza').value;
  const lunghezza=document.getElementById('lunghezza').value;
  const colore=document.getElementById('colore').value;
  const finitura=document.getElementById('finitura').value;
  const pl=document.getElementById('prezzo-listino').value;
  const ps=document.getElementById('prezzo-scontato').value;
  const isCoda=tipologia.includes('CODA');
  document.getElementById('field-lunghezza').style.display=isCoda?'block':'none';
  document.getElementById('field-altezza').style.display=isCoda?'none':'block';
  const matricola=document.getElementById('matricola-annuncio').value.trim();
  const mostraMatricola=document.getElementById('mostra-matricola').checked;

  const frasiSel=[];
  FRASI.forEach((f,i)=>{if(document.getElementById('frase-'+i).checked)frasiSel.push(f);});
  if(document.getElementById('cb-altro').checked){const a=document.getElementById('frase-altro').value.trim();if(a)frasiSel.push(a);}

  const serviziSel=[];
  SERVIZI_DEFAULT.forEach((s,i)=>{if(document.getElementById('srv-'+i).checked)serviziSel.push(s);});

  let t='';
  const silentTitolo=document.getElementById('silent-check').checked;
  t+=`${tipologia} ${marcaFinale} ${modelloFinale}${silentTitolo?' SILENT':''}\n`;
  t+=`(ANNO PRODUZIONE ${anno})\n\n`;
  if(frasiSel.length)t+=frasiSel.join(' - ')+'\n\n';
  t+=`Altezza: ${altezza} cm\n`;
  if(isCoda)t+=`Lunghezza: ${lunghezza} cm\n`;
  t+=`Finitura ${colore} ${finitura}\n`;
  if(silentTitolo){const tipoSilent=document.getElementById('tipo-silent').value;t+=`${tipoSilent}\n`;}
  if(mostraMatricola&&matricola)t+=`Matricola: ${matricola}\n`;
  t+=`\nPREZZO DI LISTINO DELL'USATO € ${parseInt(pl).toLocaleString('it-IT')},00\n`;
  t+=`PREZZO SCONTATO € ${parseInt(ps).toLocaleString('it-IT')},00\n`;
  if(serviziSel.length){t+=`\nSERVIZI INCLUSI:\n`;serviziSel.forEach(s=>t+=`✓ ${s}\n`);}
  t+=`\nSiamo accordatori e tecnici specializzati, non rivenditori generici\n`;
  t+=`Prova degli strumenti su appuntamento\n`;
  t+=`Primo Contatto anche su WhatsApp al [Mostra numero]`;

  document.getElementById('preview').textContent=t;
  window._annuncioCorrente=t;
}

function trovaAnno(tabella,seriale){
  // Tabella è array di [anno, seriale_inizio], ordinato per seriale crescente
  const sorted=[...tabella].sort((a,b)=>a[1]-b[1]);
  let risultato=null;
  for(let i=0;i<sorted.length;i++){
    if(seriale>=sorted[i][1]){
      risultato=sorted[i];
    } else break;
  }
  return risultato;
}

  else if(tipo==='riparazione')form.innerHTML=formRiparazione();
  else if(tipo==='noleggio_lungo')form.innerHTML=formNoleggioLungo();
}
function vP(id){return(document.getElementById(id)||{}).value||'';}
function cP(id){return!!(document.getElementById(id)&&document.getElementById(id).checked);}
function campoFormula(p){return'<div class="prev-section"><label class="prev-label">Formula</label><select id="'+p+'formula" class="prev-input"><option>Preg.mo</option><option>Preg.ma</option><option>Spett.le</option><option>Egregio</option><option>Gentile</option></select></div><div class="prev-section"><label class="prev-label">Destinatario</label><input type="text" id="'+p+'destinatario" class="prev-input" placeholder="Nome cognome / Ente"></div>';}
function campoData(p){const oggi=new Date().toISOString().split('T')[0];return'<div class="prev-section"><label class="prev-label">Data preventivo</label><input type="date" id="'+p+'data" class="prev-input" value="'+oggi+'"></div><div class="prev-section"><label class="prev-label">Luogo</label><input type="text" id="'+p+'luogo" class="prev-input" value="Rovigo"></div><div class="prev-section"><label class="prev-label">Nome file</label><input type="text" id="'+p+'nomefile" class="prev-input" placeholder="es. 2026-05-13_Preventivo_Rossi"></div>';}
function btnGenera(fn){return'<button onclick="'+fn+'()" class="btn-primary" id="btn-genera-prev" style="margin-top:6px">Genera e salva su Drive</button><div id="prev-status" style="margin-top:10px;font-size:12px;color:#888;text-align:center"></div>';}
function formConcerto(){return'<div class="card"><h2>Noleggio per Concerto</h2>'+campoFormula('c_')+'<div class="prev-section"><label class="prev-label">Oggetto</label><input type="text" id="c_oggetto" class="prev-input" value="Preventivo di Noleggio Pianoforte per Concerto"></div><div class="prev-section"><label class="prev-label">Marca pianoforte</label><input type="text" id="c_marca" class="prev-input" placeholder="es. Yamaha"></div><div class="prev-section"><label class="prev-label">Modello pianoforte</label><input type="text" id="c_modello" class="prev-input" placeholder="es. C3"></div><div class="prev-section"><label class="prev-label">Tipo coda</label><select id="c_tipo_coda" class="prev-input"><option>Mezza</option><option>Gran</option><option>Quarto di</option><option>Tre quarti di</option></select></div><div class="prev-section"><label class="prev-label">Lunghezza (cm)</label><input type="number" id="c_lunghezza" class="prev-input" placeholder="es. 186"></div><div class="piano-block"><div class="piano-block-title">Evento 1</div><input type="text" id="c_ev1" class="prev-input" placeholder="_ 02.07 Rovigo - Piazza V. Emanuele ore 21.00 EUR 350+IVA"></div><div class="piano-block"><div class="piano-block-title">Evento 2</div><input type="text" id="c_ev2" class="prev-input" placeholder="_ 09.07 Porto Viro ... EUR 390+IVA"></div><div class="piano-block"><div class="piano-block-title">Sezione aggiuntiva (opz.)</div><input type="text" id="c_titolo_agg" class="prev-input" placeholder="es. Eventuali date aggiuntive" style="margin-bottom:6px"><input type="text" id="c_ev3" class="prev-input" placeholder="Evento 3" style="margin-bottom:6px"><input type="text" id="c_ev4" class="prev-input" placeholder="Evento 4"></div><div class="prev-section"><label class="prev-label">Prezzo totale (EUR)</label><input type="number" id="c_prezzo" class="prev-input" placeholder="es. 350"></div>'+campoData('c_')+btnGenera('generaConcerto')+'</div>';}
function formVendita(){
  let b='';
  for(let i=1;i<=4;i++){
    const chk=i===1?' checked':'';
    const disp=i===1?'block':'none';
    b+='<div class="piano-block">'
    +'<div class="prev-check-row" style="margin-bottom:0"><input type="checkbox" id="v_incluso'+i+'"'+chk+' onchange="toggleVPiano('+i+')"><label style="font-weight:600;color:#A01020">Includi Pianoforte '+i+'</label></div>'
    +'<div id="v_body'+i+'" style="display:'+disp+';margin-top:10px">'
    +'<input type="text" id="v_marca'+i+'" class="prev-input" placeholder="Marca" style="margin-bottom:6px">'
    +'<input type="text" id="v_modello'+i+'" class="prev-input" placeholder="Modello" style="margin-bottom:6px">'
    +'<input type="text" id="v_anno'+i+'" class="prev-input" placeholder="Anno" style="margin-bottom:6px">'
    +'<input type="text" id="v_matricola'+i+'" class="prev-input" placeholder="Matricola (opz.)" style="margin-bottom:6px">'
    +'<textarea id="v_desc'+i+'" class="prev-textarea" placeholder="Descrizione"></textarea>'
    +'<div class="prev-check-row"><input type="checkbox" id="v_cb_listino'+i+'"><label>Prezzo listino usato</label><input type="number" id="v_listino'+i+'" style="width:100px;padding:4px 8px;border:0.5px solid #e0e0e0;border-radius:6px;font-size:13px"></div>'
    +'<div class="prev-check-row"><input type="checkbox" id="v_cb_scontato'+i+'"><label>Prezzo scontato</label><input type="number" id="v_scontato'+i+'" style="width:100px;padding:4px 8px;border:0.5px solid #e0e0e0;border-radius:6px;font-size:13px"></div>'
    +'<div class="prev-check-row"><input type="checkbox" id="v_cb_riservato'+i+'"><label>Sconto riservato</label><input type="number" id="v_riservato'+i+'" style="width:100px;padding:4px 8px;border:0.5px solid #e0e0e0;border-radius:6px;font-size:13px"></div>'
    +'<div class="prev-check-row"><input type="checkbox" id="v_cb_offerta'+i+'"><label>Offerta riservata</label><input type="number" id="v_offerta'+i+'" style="width:100px;padding:4px 8px;border:0.5px solid #e0e0e0;border-radius:6px;font-size:13px"></div>'
    +'</div></div>';
  }
  return '<div class="card"><h2>Vendita Pianoforte</h2>'+campoFormula('v_')
  +'<div class="prev-section"><label class="prev-label">Oggetto</label><input type="text" id="v_oggetto" class="prev-input" placeholder="es. PREVENTIVO ACQUISTO PIANOFORTE"></div>'
  +b+campoData('v_')+btnGenera('generaVendita')+'</div>';

function toggleVPiano(i){
  document.getElementById('v_body'+i).style.display=cP('v_incluso'+i)?'block':'none';
}


function formRiparazione(){let ints='';for(let i=1;i<=6;i++)ints+='<input type="text" id="r_int'+i+'" class="prev-input" placeholder="Intervento '+i+'" style="margin-bottom:6px">';return'<div class="card"><h2>Riparazione / Manutenzione</h2>'+campoFormula('r_')+'<div class="prev-section"><label class="prev-label">Oggetto</label><textarea id="r_oggetto" class="prev-textarea" placeholder="es. REVISIONE e MESSA A PUNTO..."></textarea></div><div class="piano-block"><div class="piano-block-title">Interventi</div>'+ints+'</div><div class="prev-section"><label class="prev-label">Frase extra (opz.)</label><input type="text" id="r_extra" class="prev-input"></div><div class="prev-section"><label class="prev-label">Costo complessivo</label><input type="text" id="r_costo" class="prev-input" placeholder="es. 1750 IVA ESCLUSA"></div><div class="prev-section"><label class="prev-label">Escluso dal preventivo (opz.)</label><input type="text" id="r_escluso" class="prev-input"></div><div class="prev-section"><label class="prev-label">Incluso nel preventivo (opz.)</label><input type="text" id="r_incluso" class="prev-input"></div><div class="prev-section"><label class="prev-label">Consegna entro</label><input type="text" id="r_consegna" class="prev-input" placeholder="es. 31/12/2025"></div>'+campoData('r_')+btnGenera('generaRiparazione')+'</div>';}
function fmtData(d){if(!d)return'';const dt=new Date(d);return dt.toLocaleDateString('it-IT');}
async function inviaAppsScript(tipo,nomeFile,seg,pianiEsclusi){
  const status=document.getElementById('prev-status');
  const btn=document.getElementById('btn-genera-prev');
  btn.disabled=true;btn.textContent='Generazione...';
  status.innerHTML='<span class="spinner"></span>Invio in corso...';
  try{
    const res=await fetch(APPS_SCRIPT_PREVENTIVI,{method:'POST',body:JSON.stringify({tipo,nome_file:nomeFile,segnaposti:seg,pianiEsclusi:pianiEsclusi||[]}),headers:{'Content-Type':'text/plain'},redirect:'follow'});
    const data=await res.json();
    if(data.success){
      status.innerHTML='<span style="color:#A01020;font-weight:500">Salvato!</span><br><a href="'+data.wordUrl+'" target="_blank" style="font-size:12px;color:#A01020">Apri Word</a> &nbsp; <a href="'+data.pdfUrl+'" target="_blank" style="font-size:12px;color:#A01020">Apri PDF</a>';
      btn.textContent='Salvato';
    }else{throw new Error(data.error||'Errore');}
  }catch(err){
    status.innerHTML='<span style="color:#A32D2D">Errore: '+err.message+'</span>';
    btn.disabled=false;btn.textContent='Genera e salva su Drive';
  }
}
function generaConcerto(){
  const nf=vP('c_nomefile')||new Date().toISOString().split('T')[0]+'_Preventivo_Concerto';
  inviaAppsScript('concerto',nf,{
    '##FORMULA####DESTINATARIO##':vP('c_formula')+' '+vP('c_destinatario'),
    '##FORMULA## ##DESTINATARIO##':vP('c_formula')+' '+vP('c_destinatario'),
    '##OGGETTO##':vP('c_oggetto'),
    '##MARCA##':vP('c_marca'),
    '##MODELLO_PIANOFORTE##':vP('c_modello'),
    '##TIPO_CODA##':vP('c_tipo_coda'),
    '##LUNGHEZZA_PIANOFORTE##':vP('c_lunghezza'),
    '##RIGA_EVENTO_1##':vP('c_ev1'),
    '##RIGA_EVENTO_2##':vP('c_ev2'),
    '##Titolo_Sezione_Aggiuntiva##':vP('c_titolo_agg'),
    '##TITOLO_SEZIONE_AGGIUNTIVA##':vP('c_titolo_agg'),
    '##RIGA_EVENTO_3##':vP('c_ev3'),
    '##RIGA_EVENTO_4##':vP('c_ev4'),
    '##PREZZO##':vP('c_prezzo'),
    '##DATA##':fmtData(vP('c_data')),
    '##LUOGO##':vP('c_luogo'),
  });
}
function generaVendita(){
  const nf=vP('v_nomefile')||new Date().toISOString().split('T')[0]+'_Preventivo_Vendita';
  const DEL='@@CANCELLA_RIGA@@';
  const esclusi=[];
  const seg={
    '##FORMULA## ##DESTINATARIO##':vP('v_formula')+' '+vP('v_destinatario'),
    '##OGGETTO##':vP('v_oggetto'),
    '##LUOGO##':vP('v_luogo'),
    '##DATA##':fmtData(vP('v_data')),
  };
  for(let i=1;i<=4;i++){
    if(!cP('v_incluso'+i)){esclusi.push(i);continue;}
    seg['##MARCA_'+i+'##']=vP('v_marca'+i);
    seg['##MODELLO_'+i+'##']=vP('v_modello'+i);
    seg['##ANNO_'+i+'##']=vP('v_anno'+i);
    seg['##MATRICOLA_'+i+'##']=vP('v_matricola'+i);
    seg['##DESCRIZIONE_'+i+'##']=vP('v_desc'+i);
    if(cP('v_cb_listino'+i)){
      seg['##RIGA_LISTINO_'+i+'##']='Prezzo di Listino dell\u2019Usato';
      seg['##PREZZO_LISTINO_USATO_'+i+'##']=parseInt(vP('v_listino'+i)||0).toLocaleString('it-IT');
    }else{
      seg['##RIGA_LISTINO_'+i+'##']=DEL;
      seg['##PREZZO_LISTINO_USATO_'+i+'##']='';
    }
    if(cP('v_cb_scontato'+i)){
      seg['##RIGA_SCONTATO_'+i+'##']='Prezzo Scontato';
      seg['##PREZZO_SCONTATO_'+i+'##']=parseInt(vP('v_scontato'+i)||0).toLocaleString('it-IT');
    }else{
      seg['##RIGA_SCONTATO_'+i+'##']=DEL;
      seg['##PREZZO_SCONTATO_'+i+'##']='';
    }
    if(cP('v_cb_riservato'+i)){
      seg['##RIGA_SCONTO_'+i+'##']='Sconto Riservato';
      seg['##SCONTO_'+i+'##']=parseInt(vP('v_riservato'+i)||0).toLocaleString('it-IT');
    }else{
      seg['##RIGA_SCONTO_'+i+'##']=DEL;
      seg['##SCONTO_'+i+'##']='';
    }
    if(cP('v_cb_offerta'+i)){
      seg['##RIGA_OFFERTA_'+i+'##']='Offerta Riservata';
      seg['##OFFERTA_'+i+'##']=parseInt(vP('v_offerta'+i)||0).toLocaleString('it-IT');
    }else{
      seg['##RIGA_OFFERTA_'+i+'##']=DEL;
      seg['##OFFERTA_'+i+'##']='';
    }
  }
  inviaAppsScript('vendita',nf,seg,esclusi);
}

  const nf=vP('r_nomefile')||new Date().toISOString().split('T')[0]+'_Preventivo_Riparazione';
