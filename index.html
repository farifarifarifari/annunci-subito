<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generatore Annunci — Play Piano</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#1a1a1a;background:#f5f5f5;min-height:100vh}
#app{max-width:960px;margin:0 auto;padding:16px}
header{text-align:center;padding:16px 0 20px}
header svg{width:55%;max-width:260px}

/* TAB NAV */
.tab-nav{display:flex;gap:0;margin-bottom:20px;background:#fff;border:0.5px solid #e0e0e0;border-radius:10px;overflow:hidden}
.tab-nav button{flex:1;padding:11px 8px;font-size:13px;font-weight:500;background:none;border:none;cursor:pointer;color:#888;border-right:0.5px solid #e0e0e0;transition:all 0.15s}
.tab-nav button:last-child{border-right:none}
.tab-nav button.active{background:rgba(160,16,32,0.90);color:#fff}

.tab-content{display:none}
.tab-content.active{display:block}

/* GRID */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:650px){.grid{grid-template-columns:1fr}}

.card{background:#fff;border:0.5px solid #e0e0e0;border-radius:12px;padding:16px;margin-bottom:16px}
.card:last-child{margin-bottom:0}

h2{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px;margin-top:18px}
h2:first-child{margin-top:0}

.field{margin-bottom:12px}
label{font-size:11px;color:#888;display:block;margin-bottom:4px;font-weight:500}
select,input[type=text],input[type=number]{width:100%;padding:8px 10px;border:0.5px solid #e0e0e0;border-radius:8px;font-size:13px;color:#1a1a1a;background:#fff;outline:none;appearance:none;-webkit-appearance:none}
select:focus,input:focus{border-color:#A01020}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.checkbox-list{display:flex;flex-direction:column;gap:8px}
.checkbox-item{display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-size:13px;color:#333}
.checkbox-item input[type=checkbox]{margin-top:2px;accent-color:#A01020;width:15px;height:15px;flex-shrink:0;cursor:pointer}

.frase-altro textarea{width:100%;padding:8px 10px;border:0.5px solid #e0e0e0;border-radius:8px;font-size:13px;color:#1a1a1a;background:#fff;outline:none;resize:vertical;min-height:60px;font-family:inherit;margin-top:8px}
.frase-altro textarea:focus{border-color:#A01020}

.preview-box{white-space:pre-wrap;font-size:13px;line-height:1.7;color:#1a1a1a;background:#f9f9f9;border:0.5px solid #e0e0e0;border-radius:8px;padding:14px;min-height:200px;font-family:inherit}

.btn-primary{background:rgba(160,16,32,0.9);color:#fff;border:none;padding:11px 20px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;width:100%;margin-top:12px;transition:background 0.2s}
.btn-primary:hover{background:#A01020}
.btn-primary.copied{background:#639922}

.prezzi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.euro-wrap{position:relative}
.euro-wrap span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#888;font-size:13px;pointer-events:none}
.euro-wrap select{padding-left:22px}

.servizi-list{display:flex;flex-direction:column;gap:8px}
.servizio-item{display:flex;align-items:center;gap:8px;font-size:13px;color:#333}
.servizio-item input[type=checkbox]{accent-color:#A01020;width:15px;height:15px;cursor:pointer;flex-shrink:0}

/* SEZIONE MATRICOLE */
.matricola-input-wrap{position:relative}
.matricola-input-wrap input{font-size:16px;font-weight:500;padding:12px 14px;letter-spacing:1px}
.result-box{border-radius:10px;padding:16px;margin-top:14px;text-align:center}
.result-box.found{background:#fdeced;border:1.5px solid #A01020}
.result-box.notfound{background:#f5f5f5;border:0.5px solid #e0e0e0}
.result-anno{font-size:32px;font-weight:600;color:#A01020;margin-bottom:4px}
.result-label{font-size:12px;color:#888}
.result-luogo{font-size:13px;color:#555;margin-top:6px;font-weight:500}
.result-range{font-size:11px;color:#999;margin-top:4px}

.info-box{background:#f9f9f9;border:0.5px solid #e0e0e0;border-radius:8px;padding:12px;font-size:12px;color:#666;line-height:1.6;margin-top:12px}
.info-box strong{color:#1a1a1a}

.usa-annuncio-btn{display:flex;align-items:center;gap:8px;margin-top:14px;padding:10px 14px;background:#fff;border:0.5px solid #A01020;border-radius:8px;font-size:13px;color:#A01020;font-weight:500;cursor:pointer;width:100%;justify-content:center}
.usa-annuncio-btn:hover{background:#fdeced}
</style>
</head>
<body>
<div id="app">

  <!-- TAB ANNUNCIO -->
  <div id="tab-annuncio" class="tab-content active">
    <div class="grid">
      <div>
        <div class="card">
          <h2>Titolo annuncio</h2>
          <div class="field">
            <label>Tipologia</label>
            <select id="tipologia" onchange="aggiorna()">
              <option>PIANOFORTE VERTICALE</option>
              <option>PIANOFORTE A CODA</option>
            </select>
          </div>
          <div class="field">
            <label>Marca</label>
            <select id="marca" onchange="aggiornaModelli();aggiorna()">
              <option>YAMAHA</option><option>KAWAI</option><option>SCHIMMEL</option>
              <option>PETROF</option><option>NIEDERMAYER</option><option>ATLAS</option>
              <option>APOLLO</option><option>TOYO</option><option>YUKIKO</option>
              <option>TAMAKA</option><option>YOUNG CHANG</option><option>STEINBACH</option>
              <option>FURSTEIN</option><option>STEINWAY & SONS</option>
              <option>SCHULZE POLMANN</option><option>STEINER</option><option>SAMICK</option>
              <option>SIHEKO</option><option>BERNSTEIN</option><option>KLINGMANN</option>
              <option>PEARL RIVER</option><option>SOJIN</option><option>NEYMER</option>
              <option>BERGMANN</option><option>WINSTEIN</option><option>GOETZMANN</option>
              <option>MAHLER</option><option>SAKURA</option><option>ETERNA</option>
              <option>MIKI</option><option>KAISER</option><option>RIPPEN</option>
              <option>KRAUSS</option><option>AUGUST FORSTER</option><option>SCHEMA</option>
              <option>STEINBERG</option><option>RONISCH</option>
              <option value="ALTRO">Altro...</option>
            </select>
          </div>
          <div class="field" id="field-marca-altro" style="display:none">
            <label>Specifica marca</label>
            <input type="text" id="marca-altro" placeholder="Inserisci marca" oninput="aggiorna()">
          </div>
          <div class="field">
            <label>Modello</label>
            <select id="modello" onchange="aggiorna()"></select>
          </div>
          <div class="field" id="field-modello-altro" style="display:none">
            <label>Specifica modello</label>
            <input type="text" id="modello-altro" placeholder="Inserisci modello" oninput="aggiorna()">
          </div>
          <!-- SILENT -->
          <div class="field" style="border-top:0.5px solid #f0f0f0;padding-top:12px;margin-top:2px">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <label style="margin:0">Silent</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#333;cursor:pointer;margin:0">
                <input type="checkbox" id="silent-check" onchange="aggiornaSilent();aggiorna()" style="accent-color:#A01020;width:15px;height:15px">
                Pianoforte con Silent
              </label>
            </div>
          </div>
          <div class="field" id="field-tipo-silent" style="display:none">
            <label>Tipo di Silent</label>
            <select id="tipo-silent" onchange="aggiorna()">
              <option>Silent Originale Yamaha</option>
              <option>Silent Originale di Fabbrica</option>
              <option>Silent Genio</option>
              <option>Silent Genio Professional</option>
              <option>Silent Genio Essence</option>
              <option>Silent Kioshi</option>
              <option>Silent Originale Kawai</option>
            </select>
          </div>

          <div class="field">
            <label>Anno di produzione</label>
            <select id="anno" onchange="aggiorna()"></select>
          </div>
          <div class="row2">
            <div class="field" id="field-altezza">
              <label>Altezza (cm)</label>
              <select id="altezza" onchange="aggiorna()"></select>
            </div>
            <div class="field" id="field-lunghezza">
              <label>Lunghezza (cm)</label>
              <select id="lunghezza" onchange="aggiorna()"></select>
            </div>
          </div>
          <div class="row2">
            <div class="field">
              <label>Colore</label>
              <select id="colore" onchange="aggiorna()">
                <option>Nero</option><option>Bianco</option><option>Grigio</option>
                <option>Noce</option><option>Mogano</option><option>Rosso</option>
                <option>Verde</option><option>Viola</option><option>Rosa</option>
                <option>Betulla</option><option>Giallo</option><option>Fantasia</option>
              </select>
            </div>
            <div class="field">
              <label>Finitura</label>
              <select id="finitura" onchange="aggiorna()">
                <option>Lucido</option><option>Opaco</option><option>SemiLucido</option>
              </select>
            </div>
          </div>
          <div class="prezzi-row">
            <div class="field">
              <label>Prezzo listino usato (€)</label>
              <div class="euro-wrap"><span>€</span><select id="prezzo-listino" onchange="aggiorna()"></select></div>
            </div>
            <div class="field">
              <label>Prezzo scontato (€)</label>
              <div class="euro-wrap"><span>€</span><select id="prezzo-scontato" onchange="aggiorna()"></select></div>
            </div>
          </div>

          <!-- MATRICOLA NELL'ANNUNCIO -->
          <div class="field" style="border-top:0.5px solid #f0f0f0;padding-top:14px;margin-top:4px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
              <label style="margin:0">Matricola nell'annuncio</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#555;cursor:pointer;margin:0">
                <input type="checkbox" id="mostra-matricola" onchange="aggiorna()" style="accent-color:#A01020;width:15px;height:15px">
                Mostra nell'annuncio
              </label>
            </div>
            <input type="text" id="matricola-annuncio" placeholder="es. 4272290" oninput="aggiorna()" style="letter-spacing:1px">
          </div>

}

function trovaAnno(tabella,seriale){
  // Tabella è array di [anno, seriale_inizio], ordinato per seriale crescente
  const sorted=[...tabella].sort((a,b)=>a[1]-b[1]);
  let risultato=null;
  for(let i=0;i<sorted.length;i++){
    if(seriale>=sorted[i][1]){
      risultato=sorted[i];
    } else break;
  }
  return risultato;
}

      const YAMAHA_US_U=[[1974,101000],[1975,102000],[1976,107000],[1977,110000],[1978,117000],[1979,124000],[1980,132000],[1981,141000],[1982,150000],[1983,160000],[1984,167000],[1985,174000],[1986,186000]];
      serialeNum=parseInt(up.replace(/^U/,''))||0;
      const r=trovaAnno(YAMAHA_US_U,serialeNum);
      mostraRisultato(r,luogo,input,btnUsa,resultDiv);return;
    } else {
      serialeNum=parseInt(input)||0;
      const r=trovaAnno(YAMAHA_JP_UPRIGHT,serialeNum);
      mostraRisultato(r,'Giappone (Hamamatsu)',input,btnUsa,resultDiv);return;
    }
  }

  if(marcaKey==='KAWAI'){
    const up=input.toUpperCase();
    if(up.startsWith('A')){
      luogo='USA';
      const KAWAI_US=[[1988,6904],[1989,7500],[1990,10200],[1991,21300],[1992,30515],[1993,39267],[1994,49071],[1995,56689],[1996,64000],[1997,74000],[1998,81000],[1999,90000],[2000,96000],[2001,100000],[2002,104000],[2003,111000],[2004,115300]];
      serialeNum=parseInt(up.replace(/^A/,''))||0;
      const r=trovaAnno(KAWAI_US,serialeNum);
      mostraRisultato(r,luogo,input,btnUsa,resultDiv);return;
    } else if(up.startsWith('F')){
      luogo='Indonesia';
      const KAWAI_ID=[[2003,200],[2004,2200],[2005,4700],[2006,10600],[2007,18700],[2008,30500],[2009,40085],[2010,49000],[2011,57700],[2012,67900]];
      serialeNum=parseInt(up.replace(/^F/,''))||0;
      const r=trovaAnno(KAWAI_ID,serialeNum);
      mostraRisultato(r,luogo,input,btnUsa,resultDiv);return;
    } else {
      serialeNum=parseInt(input)||0;
      const r=trovaAnno(KAWAI_JP,serialeNum);
      mostraRisultato(r,'Giappone',input,btnUsa,resultDiv);return;
    }
  }

  if(marcaKey==='STEINWAY'){
    serialeNum=parseInt(input.replace(/[^0-9]/g,''))||0;
    const r=trovaAnno(STEINWAY,serialeNum);
    mostraRisultato(r,'New York / Amburgo',input,btnUsa,resultDiv);return;
  }
}

function mostraRisultato(r,luogo,inputRaw,btnUsa,resultDiv,nota=''){
  if(!r){
    resultDiv.innerHTML=`<div class="result-box notfound"><div style="font-size:14px;color:#888">Matricola non trovata nelle tabelle disponibili</div></div>`;
    btnUsa.style.display='none';
    return;
  }
  const anno=r[0];
  resultDiv.innerHTML=`<div class="result-box found">
    <div class="result-anno">${anno}</div>
    <div class="result-label">Anno di produzione stimato</div>
    <div class="result-luogo">📍 ${luogo}</div>
    ${nota?`<div class="result-range">${nota}</div>`:''}
  </div>`;
  window._annoTrovato=anno;
  window._matricolaTrovata=inputRaw;
  btnUsa.style.display='flex';
}

function usaInAnnuncio(){
  // Imposta anno nell'annuncio
  if(window._annoTrovato){
    const selAnno=document.getElementById('anno');
    selAnno.value=window._annoTrovato;
  }
  // Imposta matricola
  if(window._matricolaTrovata){
    document.getElementById('matricola-annuncio').value=window._matricolaTrovata;
    document.getElementById('mostra-matricola').checked=true;
  }
  // Vai al tab annuncio
  showTab('annuncio');
  aggiorna();
}

// ===================== TAB =====================
function showTab(name){
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab-nav button').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  const idx=name==='annuncio'?0:1;
  document.querySelectorAll('.tab-nav button')[idx].classList.add('active');
  if(name==='matricole') cercaMatricola();
}

aggiorna();
cercaMatricola();
</script>
